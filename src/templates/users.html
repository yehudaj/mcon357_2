<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>All Users</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>
  <h1>All Users</h1>
  <p><a href="{{ url_for('auth.logout') }}">Logout</a></p>
  {% if users %}
    <table>
      <thead>
        <tr><th>ID</th><th>Google ID</th><th>Name</th><th>Email</th><th>Birthday</th></tr>
      </thead>
      <tbody>
      {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.google_id }}</td>
          <td>{{ u.name }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.birthday }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No users found.</p>
  {% endif %}
</body>
</html>
