<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign Up</title>
</head>
<body>
  <h1>Complete your sign-up</h1>
  <p>Please confirm your name and provide your birthday to finish creating your account.</p>

  <form method="post">
    <label>Name: <strong>{{ pending.name }}</strong></label><br>
    <label>Email: <strong>{{ pending.email }}</strong></label><br>
    <label for="birthday">Birthday:</label>
    <input id="birthday" name="birthday" type="date" required><br>
    <button type="submit">Create account</button>
  </form>

  <p><a href="{{ url_for('auth.logout') }}">Cancel</a></p>
</body>
</html>
